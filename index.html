<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>挂逼后台</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --card-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --green: #34d399;
            --red: #f87171;
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
            top: -200px;
            left: -100px;
            z-index: 0;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(52, 211, 153, 0.08) 0%, transparent 70%);
            bottom: -150px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }
        .login-container, .admin-main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }
        .admin-main { max-width: 900px; display: none; }
        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .login-card h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }
        .message { margin-top: 16px; font-size: 14px; display: none; }
        .message.error { color: var(--red); display: block; }
        .message.success { color: var(--green); display: block; }
        .panel-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .panel-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-header h3 { font-size: 18px; font-weight: 600; }
        .back-link { color: var(--muted); text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .back-link:hover { color: var(--text); }
        .tabs { display: flex; border-bottom: 1px solid var(--glass-border); overflow-x: auto; }
        .tab {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            color: var(--muted);
            white-space: nowrap;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-content { padding: 24px; }
        .panel { display: none; }
        .panel.active { display: block; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .form-group input:focus { border-color: var(--accent); }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--glass-border);
        }
        .toggle-row span { font-size: 14px; }
        .switch {
            width: 44px;
            height: 24px;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }
        .switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.2s;
        }
        .switch.active { background: var(--accent); }
        .switch.active::after { left: 22px; }
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            background: rgba(255,255,255,0.1);
            color: var(--text);
            border: 1px solid var(--glass-border);
        }
        .btn:hover { background: rgba(255,255,255,0.15); }
        .btn-save { background: var(--accent); border: none; color: white; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        .btn-save:hover { background: var(--accent-hover); }
        .btn-lose { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.4); }
        .btn-win { background: rgba(52,211,153,0.15); color: var(--green); border: 1px solid rgba(52,211,153,0.4); }
        .btn-del { background: none; color: var(--red); border: none; font-size: 16px; padding: 0 4px; cursor: pointer; opacity: 0.7; }
        .btn-del:hover { opacity: 1; }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(99,102,241,0.15);
            color: var(--accent);
            margin-bottom: 16px;
        }
        .ledger-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        @media (max-width: 700px) { .ledger-grid { grid-template-columns: 1fr; } }
        .ledger-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
        }
        .ledger-stats { display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: 600; }
        .ledger-history { max-height: 150px; overflow-y: auto; font-size: 13px; margin-bottom: 12px; }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .history-item .item-info { display: flex; justify-content: space-between; flex: 1; }
        .input-area { display: flex; gap: 8px; }
        .input-area input {
            flex: 1;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
        }
        .flex-right { display: flex; justify-content: flex-end; margin-top: 16px; }
    </style>
</head>
<body>

<div class="login-container" id="loginBox">
    <div class="login-card">
        <h2>管理系统登录</h2>
        <p>请输入密码以继续</p>
        <form id="loginForm">
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="······" required>
            </div>
            <button type="submit" class="btn-primary">登 录</button>
            <div id="messageBox" class="message"></div>
        </form>
    </div>
</div>

<div class="admin-main" id="adminMain">
    <div class="panel-card">
        <div class="panel-header">
            <h3>控制面板</h3>
            <a href="http://xn--kprpc.xynb1.xyz/" class="back-link">← 返回主页</a>
        </div>
        <div class="tabs">
            <div class="tab active" data-tab="profile">资料编辑</div>
            <div class="tab" data-tab="appearance">外观设置</div>
            <div class="tab" data-tab="settings">系统功能</div>
            <div class="tab" data-tab="ledger">账本管理</div>
        </div>

        <div class="tab-content">
            <div class="panel active" id="panel-profile">
                <span class="status-badge" id="syncStatus">✅ 已加载云端配置</span>
                <div class="form-grid">
                    <div class="form-group">
                        <label>昵称</label>
                        <input id="adminName" value="Yukecil">
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input id="adminEmail" value="hello@example.com">
                    </div>
                    <div class="form-group">
                        <label>Telegram (不含@)</label>
                        <input id="adminTelegram" value="yourname">
                    </div>
                    <div class="form-group">
                        <label>自定义一言（可选）</label>
                        <input id="adminText" placeholder="留空则使用每日一言">
                    </div>
                </div>
                <div class="flex-right">
                    <button class="btn btn-save" id="saveProfileBtn">💾 保存</button>
                </div>
            </div>

            <div class="panel" id="panel-appearance">
                <div class="form-grid">
                    <div class="form-group">
                        <label>头像URL</label>
                        <input id="adminAvatar" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>手机端背景URL</label>
                        <input id="adminBgMobile" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>电脑端背景URL</label>
                        <input id="adminBgDesktop" placeholder="https://...">
                    </div>
                </div>
                <div class="flex-right">
                    <button class="btn btn-save" id="saveAppearanceBtn">💾 保存外观</button>
                </div>
            </div>

            <div class="panel" id="panel-settings">
                <div class="toggle-row">
                    <span>一言展示</span>
                    <div class="switch active" id="toggleHitokoto"></div>
                </div>
                <div class="toggle-row">
                    <span>粒子动画</span>
                    <div class="switch active" id="toggleParticles"></div>
                </div>
                <div class="toggle-row">
                    <span>星空背景</span>
                    <div class="switch active" id="toggleStars"></div>
                </div>
                <div class="flex-right">
                    <button class="btn btn-save" id="saveSettingsBtn">💾 保存开关</button>
                </div>
            </div>

            <div class="panel" id="panel-ledger">
                <span class="status-badge" id="ledgerStatus">✅ 已加载云端账本</span>
                <div class="ledger-grid">
                    <!-- 买码（原六合彩） -->
                    <div class="ledger-card">
                        <div class="ledger-stats">
                            <span>买码</span>
                            <span>输 <span id="lhcLoseBack">0</span> | 赢 <span id="lhcWinBack">0</span></span>
                        </div>
                        <div class="ledger-history" id="lhcHistoryBack"></div>
                        <div class="input-area">
                            <input type="number" id="lhcAmount" placeholder="金额" min="1">
                            <button class="btn btn-lose" id="lhcLoseBtn">输</button>
                            <button class="btn btn-win" id="lhcWinBtn">赢</button>
                        </div>
                    </div>
                    <!-- 买球 -->
                    <div class="ledger-card">
                        <div class="ledger-stats">
                            <span>买球</span>
                            <span>输 <span id="buyballLoseBack">0</span> | 赢 <span id="buyballWinBack">0</span></span>
                        </div>
                        <div class="ledger-history" id="buyballHistoryBack"></div>
                        <div class="input-area">
                            <input type="number" id="buyballAmount" placeholder="金额" min="1">
                            <button class="btn btn-lose" id="buyballLoseBtn">输</button>
                            <button class="btn btn-win" id="buyballWinBtn">赢</button>
                        </div>
                    </div>
                    <!-- PG -->
                    <div class="ledger-card">
                        <div class="ledger-stats">
                            <span>PG</span>
                            <span>输 <span id="pgLoseBack">0</span> | 赢 <span id="pgWinBack">0</span></span>
                        </div>
                        <div class="ledger-history" id="pgHistoryBack"></div>
                        <div class="input-area">
                            <input type="number" id="pgAmount" placeholder="金额" min="1">
                            <button class="btn btn-lose" id="pgLoseBtn">输</button>
                            <button class="btn btn-win" id="pgWinBtn">赢</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
  const VALID_PASSWORD = 'xy123';
  const BIN_ID = '6a2a15f7da38895dfeaa9630';
  const API_KEY = '$2a$10$hxCwaa9VTSuns2o6OiUV/.gEIZ1wzMQYlNgwWVf1OfXDNY1lJMkGO';
  const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

  const loginBox = document.getElementById('loginBox');
  const adminMain = document.getElementById('adminMain');
  const loginForm = document.getElementById('loginForm');
  const passwordInput = document.getElementById('password');
  const messageBox = document.getElementById('messageBox');

  let ledgerData = {
    lhc: { win: 0, lose: 0, history: [] },
    pg: { win: 0, lose: 0, history: [] },
    buyball: { win: 0, lose: 0, history: [] }
  };

  if (localStorage.getItem('admin_logged_in') === 'true') {
    loginBox.style.display = 'none';
    adminMain.style.display = 'block';
    initAdmin();
  }

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (passwordInput.value === VALID_PASSWORD) {
      messageBox.textContent = '✅ 登录成功，即将跳转...';
      messageBox.className = 'message success';
      localStorage.setItem('admin_logged_in', 'true');
      setTimeout(() => {
        loginBox.style.display = 'none';
        adminMain.style.display = 'block';
        initAdmin();
      }, 800);
    } else {
      messageBox.textContent = '❌ 密码错误，请重试';
      messageBox.className = 'message error';
      passwordInput.value = '';
    }
  });

  function initAdmin() {
    // 标签页切换
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const target = tab.getAttribute('data-tab');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`panel-${target}`).classList.add('active');
      });
    });

    // 开关
    ['toggleHitokoto','toggleParticles','toggleStars'].forEach(id => {
      document.getElementById(id).addEventListener('click', function(){ this.classList.toggle('active'); });
    });

    // 保存按钮
    document.getElementById('saveProfileBtn').addEventListener('click', saveAllToCloud);
    document.getElementById('saveAppearanceBtn').addEventListener('click', saveAllToCloud);
    document.getElementById('saveSettingsBtn').addEventListener('click', saveAllToCloud);

    // 账本按钮绑定
    document.getElementById('lhcLoseBtn').addEventListener('click', () => addLedger('lhc','lose'));
    document.getElementById('lhcWinBtn').addEventListener('click', () => addLedger('lhc','win'));
    document.getElementById('buyballLoseBtn').addEventListener('click', () => addLedger('buyball','lose'));
    document.getElementById('buyballWinBtn').addEventListener('click', () => addLedger('buyball','win'));
    document.getElementById('pgLoseBtn').addEventListener('click', () => addLedger('pg','lose'));
    document.getElementById('pgWinBtn').addEventListener('click', () => addLedger('pg','win'));

    function updateLedgerUI() {
      document.getElementById('lhcLoseBack').textContent = ledgerData.lhc.lose;
      document.getElementById('lhcWinBack').textContent = ledgerData.lhc.win;
      document.getElementById('buyballLoseBack').textContent = ledgerData.buyball.lose;
      document.getElementById('buyballWinBack').textContent = ledgerData.buyball.win;
      document.getElementById('pgLoseBack').textContent = ledgerData.pg.lose;
      document.getElementById('pgWinBack').textContent = ledgerData.pg.win;

      renderHistory('lhc', 'lhcHistoryBack');
      renderHistory('buyball', 'buyballHistoryBack');
      renderHistory('pg', 'pgHistoryBack');
    }

    function renderHistory(type, containerId) {
      const container = document.getElementById(containerId);
      const history = ledgerData[type].history;
      if (!history || history.length === 0) {
        container.innerHTML = '<div style="color:#666;text-align:center;padding:10px;">暂无记录</div>';
        return;
      }
      const display = history.slice(-10).reverse();
      container.innerHTML = display.map((item, dispIdx) => {
        const origIdx = history.length - 1 - dispIdx;
        const isWin = item.action === 'win';
        return `
          <div class="history-item">
            <div class="item-info">
              <span style="color:#94a3b8;">${item.time}</span>
              <span style="color:${isWin?'#34d399':'#f87171'}">${isWin?'+':'-'}${item.amount}</span>
            </div>
            <button class="btn-del" data-type="${type}" data-index="${origIdx}">✕</button>
          </div>
        `;
      }).join('');
      container.querySelectorAll('.btn-del').forEach(btn => {
        btn.addEventListener('click', function() {
          const type = this.getAttribute('data-type');
          const index = parseInt(this.getAttribute('data-index'));
          deleteLedgerItem(type, index);
        });
      });
    }

    async function deleteLedgerItem(type, index) {
      if (!confirm('确定删除这条记录吗？')) return;
      const history = ledgerData[type].history;
      if (index < 0 || index >= history.length) return;
      const item = history[index];
      ledgerData[type][item.action] -= item.amount;
      history.splice(index, 1);

      try {
        const res = await fetch(`${BIN_URL}/latest`, { headers: { 'X-Master-Key': API_KEY } });
        const cloudData = (await res.json()).record || {};
        cloudData.ledger = ledgerData;
        await fetch(BIN_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify(cloudData)
        });
        document.getElementById('ledgerStatus').textContent = '✅ 同步成功';
      } catch (e) {
        ledgerData[type][item.action] += item.amount;
        history.splice(index, 0, item);
        document.getElementById('ledgerStatus').textContent = '❌ 同步失败，已恢复';
      }
      updateLedgerUI();
    }

    async function addLedger(type, action) {
      const input = document.getElementById(`${type}Amount`);
      const amount = parseInt(input.value);
      if (!amount || amount <= 0) return alert('请输入有效金额');
      ledgerData[type][action] += amount;
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      ledgerData[type].history.push({ action, amount, time: timeStr });

      try {
        const res = await fetch(`${BIN_URL}/latest`, { headers: { 'X-Master-Key': API_KEY } });
        const cloudData = (await res.json()).record || {};
        cloudData.ledger = ledgerData;
        await fetch(BIN_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify(cloudData)
        });
        document.getElementById('ledgerStatus').textContent = '✅ 已同步';
      } catch (e) {
        document.getElementById('ledgerStatus').textContent = '❌ 同步失败';
      }
      updateLedgerUI();
      input.value = '';
    }

    async function loadCloudConfig() {
      try {
        const res = await fetch(`${BIN_URL}/latest`, { headers: { 'X-Master-Key': API_KEY } });
        const data = (await res.json()).record || {};
        document.getElementById('adminName').value = data.title || 'Yukecil';
        document.getElementById('adminEmail').value = data.email || '';
        document.getElementById('adminTelegram').value = data.telegram || '';
        document.getElementById('adminAvatar').value = data.avatar || '';
        document.getElementById('adminBgMobile').value = data.bgMobile || '';
        document.getElementById('adminBgDesktop').value = data.bgDesktop || '';
        document.getElementById('adminText').value = data.text || '';
        document.getElementById('toggleHitokoto').classList.toggle('active', data.hitokotoEnabled !== false);
        document.getElementById('toggleParticles').classList.toggle('active', data.particlesEnabled !== false);
        document.getElementById('toggleStars').classList.toggle('active', data.starsEnabled !== false);

        if (data.ledger) {
          if (!data.ledger.buyball) data.ledger.buyball = { win:0, lose:0, history:[] };
          if (!data.ledger.pg) data.ledger.pg = { win:0, lose:0, history:[] };
          if (!data.ledger.lhc) data.ledger.lhc = { win:0, lose:0, history:[] };
          ledgerData = data.ledger;
          updateLedgerUI();
        }
        document.getElementById('syncStatus').textContent = '✅ 已加载云端配置';
        document.getElementById('ledgerStatus').textContent = '✅ 已加载云端账本';
      } catch (e) {
        document.getElementById('syncStatus').textContent = '❌ 加载失败';
      }
    }

    async function saveAllToCloud() {
      const statusEl = document.getElementById('syncStatus');
      statusEl.textContent = '⏳ 正在保存...';
      let currentData = {};
      try {
        const res = await fetch(`${BIN_URL}/latest`, { headers: { 'X-Master-Key': API_KEY } });
        currentData = (await res.json()).record || {};
      } catch (e) {}

      const newData = {
        title: document.getElementById('adminName').value.trim(),
        email: document.getElementById('adminEmail').value.trim(),
        telegram: document.getElementById('adminTelegram').value.trim(),
        avatar: document.getElementById('adminAvatar').value.trim(),
        bgMobile: document.getElementById('adminBgMobile').value.trim(),
        bgDesktop: document.getElementById('adminBgDesktop').value.trim(),
        text: document.getElementById('adminText').value.trim(),
        hitokotoEnabled: document.getElementById('toggleHitokoto').classList.contains('active'),
        particlesEnabled: document.getElementById('toggleParticles').classList.contains('active'),
        starsEnabled: document.getElementById('toggleStars').classList.contains('active'),
        ledger: currentData.ledger || ledgerData
      };

      try {
        await fetch(BIN_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify(newData)
        });
        statusEl.textContent = '✅ 已保存到云端';
      } catch (e) {
        statusEl.textContent = '❌ 保存失败';
      }
    }

    loadCloudConfig();
  }
})();
</script>
</body>
</html>
